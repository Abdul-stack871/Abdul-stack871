name: Update LeetCode Dashboard

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-leetcode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests

      - name: Update LeetCode dashboard
        run: python scripts/leetcode_update.py

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/leetcode-dashboard.svg

          if git diff --cached --quiet; then
            echo "No LeetCode changes detected."
          else
            git commit -m "Update LeetCode dashboard"
            git push
          fi
