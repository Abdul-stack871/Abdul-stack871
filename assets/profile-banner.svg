<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Main background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#160B2E"/>
      <stop offset="0.45" stop-color="#090D1C"/>
      <stop offset="1" stop-color="#061B32"/>
    </linearGradient>

    <!-- Name gradient -->
    <linearGradient id="nameGradient" x1="350" y1="120" x2="850" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B85CFF"/>
      <stop offset="0.5" stop-color="#8E8CFF"/>
      <stop offset="1" stop-color="#18C8FF"/>
    </linearGradient>

    <!-- Purple glow -->
    <radialGradient id="purpleGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(120 140) rotate(25) scale(300 260)">
      <stop stop-color="#7B2CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7B2CFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Blue glow -->
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1080 150) rotate(155) scale(300 260)">
      <stop stop-color="#008CFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#008CFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Border gradient -->
    <linearGradient id="borderGradient" x1="0" y1="0" x2="1200" y2="0">
      <stop stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#5B7CFF"/>
      <stop offset="1" stop-color="#00C8FF"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glowPurple" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowBlue" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.025"/>
    </pattern>

  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#bg)"/>

  <!-- Glow areas -->
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#purpleGlow)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#blueGlow)"/>

  <!-- Subtle grid -->
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#grid)"/>

  <!-- LEFT NETWORK -->

  <g stroke="#A855F7" stroke-opacity="0.32" stroke-width="1">
    <line x1="45" y1="55" x2="130" y2="105"/>
    <line x1="130" y1="105" x2="210" y2="48"/>
    <line x1="130" y1="105" x2="170" y2="180"/>
    <line x1="170" y1="180" x2="75" y2="235"/>
    <line x1="170" y1="180" x2="250" y2="220"/>
    <line x1="75" y1="235" x2="45" y2="55"/>
    <line x1="210" y1="48" x2="250" y2="220"/>
    <line x1="250" y1="220" x2="205" y2="275"/>
    <line x1="170" y1="180" x2="205" y2="275"/>
  </g>

  <g filter="url(#glowPurple)">
    <circle cx="45" cy="55" r="4" fill="#C77DFF"/>
    <circle cx="130" cy="105" r="5" fill="#B95CFF"/>
    <circle cx="210" cy="48" r="4" fill="#C77DFF"/>
    <circle cx="170" cy="180" r="4" fill="#A855F7"/>
    <circle cx="75" cy="235" r="4" fill="#C77DFF"/>
    <circle cx="250" cy="220" r="4" fill="#B95CFF"/>
    <circle cx="205" cy="275" r="3" fill="#A855F7"/>
  </g>

  <!-- RIGHT NETWORK -->

  <g stroke="#00B8FF" stroke-opacity="0.30" stroke-width="1">
    <line x1="1150" y1="48" x2="1060" y2="92"/>
    <line x1="1060" y1="92" x2="1105" y2="160"/>
    <line x1="1105" y1="160" x2="1015" y2="215"/>
    <line x1="1015" y1="215" x2="1090" y2="270"/>
    <line x1="1090" y1="270" x2="1180" y2="220"/>
    <line x1="1180" y1="220" x2="1150" y2="48"/>
    <line x1="1015" y1="215" x2="950" y2="150"/>
    <line x1="950" y1="150" x2="1060" y2="92"/>
    <line x1="1105" y1="160" x2="1180" y2="220"/>
  </g>

  <g filter="url(#glowBlue)">
    <circle cx="1150" cy="48" r="4" fill="#00C8FF"/>
    <circle cx="1060" cy="92" r="5" fill="#18C8FF"/>
    <circle cx="1105" cy="160" r="4" fill="#00B8FF"/>
    <circle cx="1015" cy="215" r="4" fill="#18C8FF"/>
    <circle cx="1090" cy="270" r="4" fill="#00C8FF"/>
    <circle cx="1180" cy="220" r="4" fill="#18C8FF"/>
    <circle cx="950" cy="150" r="3" fill="#00C8FF"/>
  </g>

  <!-- Small decorative particles -->
  <g fill="#FFFFFF">
    <circle cx="280" cy="65" r="1.5" opacity="0.5"/>
    <circle cx="920" cy="70" r="1.5" opacity="0.5"/>
    <circle cx="310" cy="260" r="1.5" opacity="0.35"/>
    <circle cx="890" cy="260" r="1.5" opacity="0.35"/>
  </g>

  <!-- Main text -->
  <text
    x="600"
    y="82"
    text-anchor="middle"
    fill="#F4F4F5"
    font-family="Arial, Helvetica, sans-serif"
    font-size="25"
    font-weight="400">
    Hello, I'm
  </text>

  <!-- Name -->
  <text
    x="600"
    y="145"
    text-anchor="middle"
    fill="url(#nameGradient)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="57"
    font-weight="700">
    Abdul Rahman
  </text>

  <!-- Professional identity -->
  <text
    x="600"
    y="185"
    text-anchor="middle"
    fill="#E5E7EB"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19"
    font-weight="500">
    Java Full Stack Developer | AI Enthusiast | Problem Solver
  </text>

  <!-- Code -->
  <text
    x="475"
    y="238"
    text-anchor="middle"
    fill="#E9D5FF"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="600">
    &lt;/&gt; Code
  </text>

  <!-- Build -->
  <text
    x="600"
    y="238"
    text-anchor="middle"
    fill="#E0F2FE"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="600">
    🚀 Build
  </text>

  <!-- Innovate -->
  <text
    x="730"
    y="238"
    text-anchor="middle"
    fill="#FEF3C7"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    font-weight="600">
    💡 Innovate
  </text>

  <!-- Bottom subtle line -->
  <rect
    x="390"
    y="270"
    width="420"
    height="1"
    rx="1"
    fill="url(#borderGradient)"
    opacity="0.35"/>

  <!-- Border -->
  <rect
    x="1"
    y="1"
    width="1198"
    height="318"
    rx="18"
    stroke="url(#borderGradient)"
    stroke-opacity="0.75"
    stroke-width="2"/>

</svg>
